services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aivis
      POSTGRES_PASSWORD: aivis
      POSTGRES_DB: ai_visibility
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivis"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aivis:aivis@db:5432/ai_visibility
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "flask db upgrade && gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 60 run:app"

volumes:
  pgdata:
